modules:
  rovo:agent:
    - key: knowwho-agent
      name: KnowWho
      description: Answers who should review, own, or unblock a Jira issue, with a ranked expert list and evidence from the Teamwork Graph.
      prompt: resource:agent-prompt;prompt.md
      conversationStarters:
        - Who should review PROJ-123?
        - Who should own this issue?
        - Who can unblock this work?
        - Who knows the most about this topic?
      actions:
        - knowwho-rank-experts
        - knowwho-page-authors
        - knowwho-past-resolvers
        - knowwho-component-owner
        - knowwho-workload
  action:
    - key: knowwho-rank-experts
      name: Rank experts for an issue
      function: rankExperts
      actionVerb: GET
      description: |
        For one Jira issue, returns a ranked shortlist of the best people to review, own, or unblock it, with a one-line reason and evidence for each person.
        Use it for "who should review PROJ-123", "who should own this issue", "who can unblock this", or "who is the best person for this work".
        Leave issueKey empty to use the work item open on screen.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: The Jira work item key, for example PROJ-123. Leave empty to use the work item open on screen.
        role:
          title: Role
          type: string
          required: false
          description: "What the person is needed for: reviewer, owner, or unblocker. Leave empty for a general ranking."
    - key: knowwho-page-authors
      name: Find Confluence page authors for a topic
      function: findPageAuthors
      actionVerb: GET
      description: |
        Finds Confluence pages about a topic and lists the people who wrote or contributed to them, with a link to each page.
        Use it for "who wrote about payments", "who knows about the onboarding guide", or "who authored the runbook for X".
      inputs:
        topic:
          title: Topic
          type: string
          required: true
          description: The topic to search Confluence for, for example "payments runbook" or "onboarding".
    - key: knowwho-past-resolvers
      name: Find past resolvers of similar issues
      function: findPastResolvers
      actionVerb: GET
      description: |
        Finds Jira issues similar to a given issue (same project, component, or keywords) that are already done, and lists the people who resolved them, with counts.
        Use it for "who fixed similar issues before" or "who has worked on issues like PROJ-123".
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: The Jira work item key to find similar issues for, for example PROJ-123. Leave empty and give keywords instead.
        keywords:
          title: Keywords
          type: string
          required: false
          description: Keywords describing the work, for example "payment webhook timeout". Used when no issueKey is given.
    - key: knowwho-component-owner
      name: Find the owner of a component or service
      function: findComponentOwner
      actionVerb: GET
      description: |
        Finds who owns a Jira component or service: the component lead, and the people who most recently worked on issues in that component.
        Use it for "who owns the payments component" or "who is responsible for the checkout service".
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: false
          description: A Jira work item key in the component, for example PROJ-123. Leave empty and give a component name instead.
        component:
          title: Component name
          type: string
          required: false
          description: The component name, for example "payments". Used when no issueKey is given.
    - key: knowwho-workload
      name: Check a person's current workload
      function: getWorkload
      actionVerb: GET
      description: |
        Lists the open Jira work items assigned to a person, with status, so you can tell whether they have capacity to take on more work.
        Use it for "how busy is Asha" or "does Marcus have capacity". Leave person empty for the user who is asking.
      inputs:
        person:
          title: Person
          type: string
          required: false
          description: A person's name or email. Leave empty to mean the user who is asking.
  rovo:mcp:
    - key: knowwho-mcp
      name: KnowWho MCP
      description: Exposes KnowWho expert-finding tools to MCP-compatible AI clients.
      tools:
        - knowwho-rank-experts
        - knowwho-page-authors
        - knowwho-past-resolvers
        - knowwho-component-owner
        - knowwho-workload
  jira:issuePanel:
    - key: knowwho-issue-panel
      resource: main
      resolver:
        function: panelResolver
      render: native
      title: KnowWho — who should work on this?
  function:
    - key: rankExperts
      handler: index.rankExperts
    - key: findPageAuthors
      handler: index.findPageAuthors
    - key: findPastResolvers
      handler: index.findPastResolvers
    - key: findComponentOwner
      handler: index.findComponentOwner
    - key: getWorkload
      handler: index.getWorkload
    - key: panelResolver
      handler: index.panelResolver
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: agent-prompt
    path: prompts
permissions:
  scopes:
    - read:jira-user
    - read:jira-work
    - write:jira-work
    - read:confluence-content.summary
    - read:confluence-user
    - search:confluence
    - read:graph:issue:jira
    - read:graph:issue-status:jira
    - read:graph:issue-comment:jira
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - read:graph:page:confluence
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/REPLACE-WITH-APP-ID
